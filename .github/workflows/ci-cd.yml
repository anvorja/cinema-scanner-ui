name: CI/CD

# CI en cada PR a main/develop. Los rulesets exigen como status checks los jobs "Lint", "Calidad y build", "Imagen Docker":
# si se renombra uno, actualizar .github/rulesets/*.json.
# CD, tras pasar los checks, con la misma imagen que probó CI (no se reconstruye):
#   push a develop → Docker Hub `develop` + `<sha>`
#   push a main    → Docker Hub `latest` + `<sha>`
# El sitio lo despliega Netlify desde la rama; como develop y main solo aceptan PRs
# que pasaron estos checks, a Netlify solo llega código aprobado.
# Secrets: DOCKER_USERNAME, DOCKER_TOKEN.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # El nombre del job es el status check que exigen los rulesets: mantenerlos sincronizados.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint

  quality:
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Análisis de tipos (tsc)
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cinema-scanner-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor (nginx sirve la app)
        run: |
          docker run -d --name ui -p 8080:5200 cinema-scanner-ui:ci
          for _ in $(seq 1 20); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/una/ruta/de/la/app | grep -q '<div id="root">'
          curl -sf http://localhost:8080/health
      # En main y develop: la imagen probada viaja al job de publicación, que corre cuando pasan todos los checks.
      - name: Guardar la imagen probada
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: docker save cinema-scanner-ui:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar imagen
    # Push a main o develop, y solo después de que pasaron los checks exigidos.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [lint, quality, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/cinema-scanner-ui
      # latest = producción (main); develop = integración.
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
    steps:
      - name: Obtener short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Cargar la imagen probada (no se reconstruye)
        run: gunzip -c image.tar.gz | docker load

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push a Docker Hub (canal y <sha>)
        run: |
          for tag in "$CHANNEL" "${{ steps.vars.outputs.SHORT_SHA }}"; do
            docker tag cinema-scanner-ui:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo "### Imagen publicada"
            echo "- \`$IMAGE:$CHANNEL\` y \`$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}\`"
            echo "- El sitio lo despliega Netlify; esta imagen sirve para correrlo en cualquier otro lado."
          } >> "$GITHUB_STEP_SUMMARY"
